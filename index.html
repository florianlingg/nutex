<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Executive Dashboard</title>
  <link rel="stylesheet" href="styles.css?v=88">
  <style id="print-page-style"></style>
</head>
<body>
  <!-- Full-bleed print backdrop (eliminates white PDF margins/hairlines in Dark & Light Mode) -->
  <div class="print-bg" aria-hidden="true"></div>

  <!-- Single slim header: context/back · filters · role & export (no tab bar) -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <button type="button" id="btn-back" class="btn-back" data-nav="overview">&larr; Overview</button>
        <span id="page-title" class="page-title">AI Executive Dashboard</span>
        <span class="header-sep"></span>
        <select id="filter-dept" class="control-select" aria-label="Department"></select>
        <select id="filter-time" class="control-select" aria-label="Month"></select>
        <button type="button" id="btn-reset" class="btn-reset" data-i18n="reset">Reset</button>
      </div>

      <div class="header-right">
        <select id="role-switcher" class="control-select role-select" aria-label="Active Role"></select>
        <button type="button" id="btn-pptx" class="btn-subtle" title="Export AI PowerPoint Presentation (.pptx)">PowerPoint</button>
        <button type="button" id="btn-print" class="btn-subtle" title="Export Structured PDF">PDF</button>
        <div class="settings-wrap">
          <button type="button" id="btn-settings" class="btn-icon-gear" aria-label="Settings" title="Settings">⚙</button>
          <div id="settings-menu" class="settings-menu"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- Clean Print / PDF Header (shown only when exporting PDF) -->
  <div id="print-header" class="print-header"></div>

  <!-- Main Centered Workspace -->
  <main id="view-root" class="workspace"></main>

  <!-- Modal Root (Project / Training Proposal) + Info Popover -->
  <div id="modal-root"></div>
  <div id="kpi-popover" class="kpi-popover" role="dialog"></div>

  <script src="js/data.js?v=88"></script>
  <script src="js/state.js?v=88"></script>
  <script src="js/charts.js?v=88"></script>
  <script src="js/roadmap.js?v=88"></script>
  <script src="js/value.js?v=88"></script>
  <script src="js/impact.js?v=88"></script>
  <script src="js/people.js?v=88"></script>
  <script src="js/budget.js?v=88"></script>
  <script src="js/adoption.js?v=88"></script>
  <script src="js/views.js?v=88"></script>
  <script src="js/export.js?v=88"></script>
  <script src="js/app.js?v=88"></script>
</body>
</html>
